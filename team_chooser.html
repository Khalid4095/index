<!doctype html>
<html lang="so">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Team Chooser</title>
  <style>
    body { font-family: Arial, sans-serif; text-align:center; padding:30px; }
    header { background:#0b6b3b; color:#fff; padding:12px; border-radius:6px; font-weight:700; letter-spacing:3px; margin-bottom:20px; }
    .grid { display:grid; grid-template-columns:repeat(5,80px); gap:15px; justify-content:center; margin-bottom:25px; }
    .num { background:#0b6b3b; color:#fff; font-size:1.3rem; font-weight:bold; border:none; border-radius:6px; padding:18px; cursor:pointer; }
    .num.selected { background:#555; } /* marka la taabto midabku beddel */
    .btn-pick { background:#a65f33; color:#fff; border:none; padding:14px 28px; border-radius:6px; font-size:1.1rem; font-weight:bold; letter-spacing:4px; cursor:pointer; }
    .result { margin-top:30px; font-size:1.4rem; font-weight:bold; }
  </style>
</head>
<body>
  <header>CHOOSE NUMBER</header>
  
  <div class="grid" id="grid"></div>
  
  <button class="btn-pick" id="pickBtn">P I C K  U P</button>
  
  <div class="result" id="result"></div>
  
  <script>
    const grid = document.getElementById('grid');
    const result = document.getElementById('result');
    const pickBtn = document.getElementById('pickBtn');
    let selectedNumbers = new Set(); // ensure a number can only be selected once

    // abuur 10 button
    for(let i=1; i<=10; i++){
      const btn = document.createElement('button');
      btn.textContent = i;
      btn.className = 'num';
      btn.addEventListener('click', ()=>{
        if(!btn.classList.contains('selected')){
          btn.classList.add('selected');
          selectedNumbers.add(i);
        }
      });
      grid.appendChild(btn);
    }

    function resetUI(){
      selectedNumbers.clear();
      document.querySelectorAll('.num').forEach(b => b.classList.remove('selected'));
    }

    pickBtn.addEventListener('click', ()=>{
      const numbers = Array.from(selectedNumbers);
      if(numbers.length < 2){
        result.textContent = "Ugu yaraan laba qof ha doortaan nambar.";
        return;
      }
      const idx = Math.floor(Math.random() * numbers.length);
      const chosen = numbers[idx];
      result.textContent = "The chosen number is: " + chosen;
      resetUI(); // reset after showing result
    });
  </script>
</body>
</html>
